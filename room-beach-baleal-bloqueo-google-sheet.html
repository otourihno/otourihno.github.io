<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Beach Baleal · Room Boutique Ferrel</title>
<style>
:root{--sand:#f6f1e7;--ink:#1a1a1a;--sea:#8a6a2b;--sun:#eadfc4;--card:#fffdf8;--line:#e3d7bd;--p1:#3b3b3b;--p2:#8a6a2b;--p3:#1a1a1a;--hero:#f6f1e7;--fb:Georgia,'Times New Roman',serif}
body[data-h=baleal]{--sand:#fff1d6;--ink:#0d3b4f;--sea:#0e7c95;--sun:#ff8a3d;--card:#fffaf0;--line:#f0d9a8;--p1:#38b6c9;--p2:#ff7a2f;--p3:#0d3b4f;--hero:linear-gradient(180deg,#38b6c9,#ffc857);--fb:system-ui,-apple-system,Roboto,sans-serif}
body{transition:background .3s}
*{box-sizing:border-box}
body{margin:0;font-family:var(--fb);background:var(--sand);color:var(--ink);line-height:1.5}
h1,h2,h3,button,select,label,.sans{font-family:system-ui,-apple-system,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
header b{font-size:15px}
select{padding:7px;border-radius:8px;border:0;font-size:15px}
.tabs{display:flex;flex-direction:column;gap:8px;padding:10px 14px 14px}
.tab{flex:1;padding:12px 6px;border:2px solid #b9ad92;background:#fff8;border-radius:10px;font-weight:700;font-size:14px;color:#333}
.tab.ferrel.on{background:#1a1a1a;border-color:#1a1a1a;color:#eadfc4;border-radius:4px}
.tab.baleal.on{background:#ff7a2f;border-color:#ff7a2f;color:#fff;border-radius:22px}
.hero{padding:22px 16px 22px;text-align:center;background:var(--hero);margin-bottom:14px}
.hero .tag{font-size:17px;font-weight:600}
body[data-h=baleal] .hero .tag{color:#0d3b4f}
body[data-h=baleal] .room{border-radius:22px;border:2px solid var(--line)}
body[data-h=ferrel] .room,body[data-h=ferrel] .btn,body[data-h=ferrel] .note{border-radius:3px}
body[data-h=baleal] .btn{border-radius:22px;background:#ff7a2f}
.logo{width:230px;max-width:70%;border-radius:16px;margin:0 auto 6px;display:block}
.logotxt{font-family:system-ui,sans-serif;font-weight:800;font-size:26px;letter-spacing:.5px}
.hero p{margin:6px auto;max-width:420px}
.note{background:var(--sun);color:#3a2600;padding:10px 14px;border-radius:10px;margin:0 16px 14px;font-family:system-ui,sans-serif;font-size:14px}
.rooms{display:grid;gap:12px;padding:0 16px 20px;max-width:900px;margin:auto}
@media(min-width:700px){.rooms{grid-template-columns:repeat(3,1fr)}}
.room{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ph{height:110px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-family:system-ui,sans-serif;font-weight:700}
.junior .ph{background:var(--p1)}
.medium .ph{background:var(--p2)}
.suite .ph{background:var(--p3)}
.rb{padding:12px}
.rb h3{margin:0 0 4px;font-size:17px}
.rb small{display:block;color:#5b6b6f;font-family:system-ui,sans-serif}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.price{font-family:system-ui,sans-serif;font-weight:800;font-size:20px}
.btn{background:var(--sea);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:700}
.btn:disabled{opacity:.6}
.modal{position:fixed;inset:0;background:rgba(10,20,24,.6);display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
.sheet label{display:block;font-size:14px;font-weight:600;margin-top:10px}
.sheet input,.sheet textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:16px;font-family:inherit;margin-top:3px}
.sheet select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:16px;font-family:system-ui,sans-serif;margin-top:3px;background:var(--card);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tot{margin:12px 0;font-family:system-ui,sans-serif;font-weight:700}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:8px;width:100%}
.msg{padding:14px;border-radius:10px;background:#e3f1e6;margin-top:10px;font-family:system-ui,sans-serif}
.cm{display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px}
.cm button{border:0;background:var(--line);border-radius:8px;width:40px;height:36px;font-size:20px;color:var(--ink)}
.cm b{text-transform:capitalize}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cg i{font-style:normal;font-size:12px;color:#777}
.cg button,.cg span{height:40px}
.cg button{border:0;border-radius:8px;background:transparent;font-size:15px;color:var(--ink)}
.cg button:disabled{color:#b5b0a4}
.cg .b:disabled{text-decoration:line-through}
.cg .r{background:var(--line)}
.cg .s{background:var(--sea);color:#fff;font-weight:700}
header.hm{flex-direction:column;gap:10px;padding:16px 14px 14px;background:linear-gradient(90deg,#1a1a1a 0%,#1a1a1a 42%,#0d3b4f 100%);border-bottom:3px solid #ff8a3d;box-shadow:0 3px 12px #0003}
header.hm b{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(16px,5.2vw,24px);letter-spacing:.16em;white-space:nowrap}
header.hm select{font-size:13px;padding:5px 10px;background:#eadfc4;color:#1a1a1a}header.hm b{text-align:center}header.hm .pen{display:block;margin-top:4px;font-size:clamp(12px,3.6vw,15px);letter-spacing:.3em;color:#eadfc4;opacity:.85}header.hm .f{color:#eadfc4}header.hm .d{color:#ff8a3d;margin:0 .55em;font-size:.6em;vertical-align:middle}header.hm .z{color:#ffb066}
.loc{max-width:900px;margin:0 auto 14px;padding:0 16px}
.lbox{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
body[data-h=baleal] .lbox{border-radius:22px;border:2px solid var(--line)}
body[data-h=ferrel] .lbox{border-radius:3px}
.lad{padding:10px 14px;font-family:system-ui,sans-serif;font-size:14px}
.lad b{display:block;font-size:15px;margin-bottom:2px}
.lmap{position:relative;height:120px;background:var(--line)}
.lmap iframe{width:100%;height:100%;border:0;pointer-events:none;display:block}
.lmap a{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-end;padding:8px;text-decoration:none}
.lmap span{background:var(--sea);color:#fff;font-family:system-ui,sans-serif;font-weight:700;font-size:12px;padding:5px 10px;border-radius:999px;box-shadow:0 2px 8px #0004}
.home{max-width:900px;margin:auto;padding:18px 16px 10px}
.home h1{text-align:center;font-size:22px;margin:6px 0 16px}
.hgrid{display:grid;gap:16px}
@media(min-width:700px){.hgrid{grid-template-columns:1fr 1fr}}
.hcard{display:block;width:100%;border:0;padding:26px 18px;text-align:center;cursor:pointer;box-shadow:0 4px 14px #0002}
.hcard .logo{width:200px;max-width:75%;margin:0 auto 12px}
.hcard .logotxt{margin-bottom:10px}
.hcard p{margin:0 auto 16px;max-width:340px;font-size:15px}
.hcard .go{display:inline-block;padding:11px 20px;font-weight:700;font-size:15px;font-family:system-ui,sans-serif}
.hcard.ferrel{background:#1a1a1a;color:#eadfc4;border-radius:4px;font-family:Georgia,serif}
.hcard.ferrel .go{background:#eadfc4;color:#1a1a1a;border-radius:3px}
.hcard.baleal{background:linear-gradient(180deg,#38b6c9,#ffc857);color:#0d3b4f;border-radius:26px;font-family:system-ui,sans-serif}
.hcard.baleal .go{background:#ff7a2f;color:#fff;border-radius:22px}
.tab{display:flex;align-items:center;justify-content:center}
.back{align-self:flex-start;padding:4px 2px;border:0;background:none;font-size:13px;font-weight:600;color:#555;text-decoration:underline;cursor:pointer}
.wa{position:fixed;right:14px;bottom:14px;z-index:6;display:none;align-items:center;gap:8px;background:#25d366;color:#fff;text-decoration:none;font-family:system-ui,sans-serif;font-weight:700;font-size:15px;padding:12px 16px;border-radius:999px;box-shadow:0 4px 14px #0004}
.wa svg{width:24px;height:24px;fill:#fff;flex:0 0 auto}
footer{padding-bottom:80px !important;text-align:center;padding:20px;font-size:13px;color:#5b6b6f;font-family:system-ui,sans-serif}
</style>
</head>

function parseCSV(t){
 const rows=[];let row=[],cell="",q=false;
 for(let i=0;i<t.length;i++){const ch=t[i],nx=t[i+1];
  if(ch=='"'){if(q&&nx=='"'){cell+='"';i++}else q=!q}
  else if(ch==','&&!q){row.push(cell.trim());cell=""}
  else if((ch=='\n'||ch=='\r')&&!q){if(ch=='\r'&&nx=='\n')i++;row.push(cell.trim());cell="";if(row.some(x=>x!==''))rows.push(row);row=[]}
  else cell+=ch;
 }
 if(cell!==""||row.length){row.push(cell.trim());if(row.some(x=>x!==''))rows.push(row)}
 return rows;
}
function normHeader(x){return (x||"").toString().trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function nd(x){
 x=(x||"").toString().trim();
 let m=x.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
 if(m)return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
 m=x.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
 if(m){const y=m[3].length==2?"20"+m[3]:m[3];return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0")}
 return "";
}
async function loadBooked(){
 if(!SHEET_ID)return;
 const urls=[SHEET_URL,SHEET_GVIZ_URL];
 let lastError=null;
 for(const url of urls){
  try{
   const r=await fetch(url+(url.includes("?")?"&":"?")+"t="+Date.now(),{
    cache:"no-store",
    credentials:"omit"
   });
   if(!r.ok)throw new Error("HTTP "+r.status);
   const text=await r.text();
   // Si Google devuelve una página de login/HTML en vez de CSV, probar el siguiente método.
   if(/<html|accounts\.google\.com|sign in/i.test(text.slice(0,500)))throw new Error("Google Sheets no está publicado para lectura pública");
   const rows=parseCSV(text);
   if(!rows.length)throw new Error("CSV vacío");
   const head=rows[0].map(normHeader);
   const idx=(...names)=>{for(const n of names){const i=head.indexOf(normHeader(n));if(i>=0)return i}return -1};
   const ih=idx("Habitación ID","Habitacion ID","ID Habitación","Room ID","Habitación");
   const ici=idx("Check-in","Llegada","Entrada");
   const ico=idx("Check-out","Salida");
   const ib=idx("Bloquear","Bloqueada","Activo","Estado");
   if(ih<0||ici<0||ico<0||ib<0)throw new Error("No se encuentran las columnas Habitación ID, Check-in, Check-out y Bloquear");
   const o={};
   rows.slice(1).forEach(row=>{
    const id=(row[ih]||"").toString().trim().toLowerCase();
    const a=nd(row[ici]),b=nd(row[ico]);
    const flag=normHeader(row[ib]||"");
    // SOLO "Sí" bloquea. "No" deja la habitación disponible.
    const bloqueada=["si","sí","yes","true","1"].includes(flag);
    if(id&&a&&b&&b>a&&bloqueada)(o[id]=o[id]||[]).push([a,b]);
   });
   SHEETB=o;
   SHEET_LAST_OK=Date.now();
   console.log("Disponibilidad actualizada",JSON.stringify(SHEETB));
   return true;
  }catch(e){
   lastError=e;
  }
 }
 console.log("No se pudo leer Google Sheets. Publica la pestaña 'Reservas Web' como CSV o permite acceso de lectura mediante enlace.",lastError);
 return false;
}

const MAPS={es:"Abrir en Google Maps",en:"Open in Google Maps",pt:"Abrir no Google Maps",fr:"Ouvrir dans Google Maps"};
const ADR={es:"Dirección",en:"Address",pt:"Morada",fr:"Adresse"};
const X={es:{choose:"Elige tu hotel",view:"Ver habitaciones",home:"Volver a página principal"},en:{choose:"Choose your hotel",view:"View rooms",home:"Back to main page"},pt:{choose:"Escolhe o teu hotel",view:"Ver quartos",home:"Voltar à página principal"},fr:{choose:"Choisissez votre hôtel",view:"Voir les chambres",home:"Retour à la page principale"}};
const SUB={
ferrel:{es:"Un rincón tranquilo y con carácter en Ferrel, a pasos del mar.",en:"A calm, characterful retreat in Ferrel, steps from the sea.",pt:"Um refúgio calmo e cheio de carácter em Ferrel, a passos do mar.",fr:"Une adresse calme et pleine de caractère à Ferrel, à deux pas de la mer."},
baleal:{es:"Surf, olas y buen ambiente en Baleal. Ven con tabla o alquílala aquí.",en:"Surf, waves and good vibes in Baleal. Bring your board or rent one here.",pt:"Surf, ondas e boa onda em Baleal. Traz a prancha ou aluga aqui.",fr:"Surf, vagues et bonne ambiance à Baleal. Venez avec votre planche ou louez-en une."}
};
const $=id=>document.getElementById(id);
const t=k=>T[lang][k];

function logoHTML(h){const H=HOTELS[h];
 return `<img class="logo" src="${H.logo}" alt="${H.name}" onerror="this.outerHTML='<div class=\\'logotxt\\'>${H.name}</div>'">`}

function rooms(h){const out=[];let n=1;
 for(const [k,v] of Object.entries(TYPES))for(let i=0;i<v.n;i++)out.push({id:`${h}-${n}`,num:n++,type:k,p:v.p,cap:v.cap});
 return out}

function render(){
 document.documentElement.lang=lang;
 const home=!hotel;
 {const w=$("wa");if(WHATSAPP){const h=home?"Ferrel · Baleal":HOTELS[hotel].name;w.href="https://wa.me/"+WHATSAPP.replace(/\D/g,"")+"?text="+encodeURIComponent(WAM[lang].replace("{h}",h));w.style.display="flex"}else w.style.display="none"}
 ["tabs","hero","note","loc","rooms"].forEach(i=>$(i).style.display=home?"none":"");
 $("home").style.display=home?"":"none";
 if(home){
  document.body.dataset.h="";document.title=T[lang].brand;$("brand").innerHTML='<span class="f">FERREL</span><span class="d">✦</span><span class="z">BALEAL</span><span class="pen">(Peniche)</span>';document.querySelector("header").classList.add("hm");
  $("home").innerHTML=`<h1>${X[lang].choose}</h1><div class="hgrid">`+Object.keys(HOTELS).map(h=>`<button class="hcard ${h}" onclick="hotel='${h}';render();scrollTo(0,0)">${logoHTML(h)}<p>${SUB[h][lang]}</p><span class="go">${X[lang].view} →</span></button>`).join("")+`</div>`;
  $("foot").textContent=t("foot")+" · "+EMAIL;
  return}
 document.querySelector("header").classList.remove("hm");document.body.dataset.h=hotel;document.title=HOTELS[hotel].name;
 $("brand").textContent=HOTELS[hotel].name;
 $("tabs").innerHTML=`<button class="back" onclick="hotel=null;render();scrollTo(0,0)" >← ${X[lang].home}</button>`+`<div class="tab ${hotel} on" style="text-align:center">${HOTELS[hotel].name}</div>`;
 $("hero").innerHTML=logoHTML(hotel)+`<p class="tag">${SUB[hotel][lang]}</p>`;
 $("note").textContent=t("note");
 {const q=encodeURIComponent(HOTELS[hotel].name+", "+ADDR[hotel]);
  $("loc").innerHTML=`<div class="lbox"><div class="lad"><b>📍 ${ADR[lang]}</b>${ADDR[hotel]}</div><div class="lmap"><iframe src="https://www.google.com/maps?q=${q}&output=embed&z=18" loading="lazy" title="Map" referrerpolicy="no-referrer-when-downgrade"></iframe><a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener" aria-label="${MAPS[lang]}"><span>${MAPS[lang]} ↗</span></a></div></div>`}
 $("rooms").innerHTML=rooms(hotel).map(r=>`<article class="room ${r.type}"><div class="ph">${t(r.type)}</div><div class="rb"><small>${t("guests").replace("{n}",r.cap)}</small><div class="row"><span class="price">${r.p} € <small style="display:inline;font-weight:400">${t("night")}</small></span><button class="btn" onclick="openBook('${r.id}')">${t("book")}</button></div></div></article>`).join("")+`<article class="room suite" style="grid-column:1/-1"><div class="ph">${t("monthly")}</div><div class="rb"><h3 style="margin:0 0 4px;font-size:17px">${t("monthly")}</h3><small>${t("msub")}</small><div class="row"><span class="price">550 € <small style="display:inline;font-weight:400">${t("mper")}</small></span><button class="btn" onclick="openMonthly()">${t("mreq")}</button></div></div></article>`;
 $("foot").textContent=HOTELS[hotel].name+" · "+t("foot")+" · "+EMAIL;
}

const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const taken=(id,ds)=>[...(BOOKED[id]||[]),...(SHEETB[id]||[])].some(([a,b])=>ds>=a&&ds<b);
function nextTaken(id,from){const d=new Date(from+"T12:00");for(let i=0;i<730;i++){d.setDate(d.getDate()+1);const x=iso(d);if(taken(id,x))return x}return "9999"}
function initCal(id,upd){
 const today=iso(new Date());
 const st={m:new Date(),ci:"",co:""};st.m.setDate(1);
 const fmt=x=>x?new Date(x+"T12:00").toLocaleDateString(lang,{day:"numeric",month:"short"}):"—";
 const draw=()=>{
  const y=st.m.getFullYear(),mo=st.m.getMonth(),off=(new Date(y,mo,1).getDay()+6)%7,dim=new Date(y,mo+1,0).getDate();
  const lim=st.ci&&!st.co?nextTaken(id,st.ci):"9999";
  let h=`<div class="cm"><button type="button" id="pv">‹</button><b>${new Date(y,mo,1).toLocaleDateString(lang,{month:"long",year:"numeric"})}</b><button type="button" id="nx">›</button></div><div class="cg">`;
  for(let i=0;i<7;i++)h+=`<i>${new Date(2024,0,1+i).toLocaleDateString(lang,{weekday:"narrow"})}</i>`;
  for(let i=0;i<off;i++)h+="<span></span>";
  for(let d=1;d<=dim;d++){
   const ds=iso(new Date(y,mo,d)),free=ds>=today&&!taken(id,ds);
   const ok=(st.ci&&!st.co&&ds>st.ci)?ds<=lim:free;
   const c=(ds===st.ci||ds===st.co?"s ":"")+(st.ci&&st.co&&ds>st.ci&&ds<st.co?"r ":"")+(taken(id,ds)?"b":"");
   h+=`<button type="button" class="${c}" data-d="${ds}" ${ok?"":"disabled"}>${d}</button>`}
  $("cal").innerHTML=h+"</div>";
  $("dh").textContent=(st.ci?t("ci")+": "+fmt(st.ci)+" · "+t("co")+": "+fmt(st.co):t("pick"));
  $("ci").value=st.ci;$("co").value=st.co;upd();
  $("pv").onclick=()=>{st.m.setMonth(st.m.getMonth()-1);draw()};
  $("nx").onclick=()=>{st.m.setMonth(st.m.getMonth()+1);draw()};
  $("cal").querySelectorAll("button[data-d]").forEach(b=>b.onclick=()=>{const ds=b.dataset.d;
   if(!st.ci||st.co||ds<=st.ci){st.ci=ds;st.co=""}else st.co=ds;draw()});
 };
 window.__redrawCalendar=draw;
 draw();
 if(SHEET_ID)loadBooked().then(draw);
}
function openBook(id){
 const r=rooms(id.split("-")[0]).find(x=>x.id===id);
 const today=new Date().toISOString().slice(0,10);
 $("sheet").innerHTML=`<h2 style="margin:0">${HOTELS[hotel].name}</h2><div class="sans">${t(r.type)} · ${r.p} €</div>
 <div id="cal"></div><input type="hidden" id="ci"><input type="hidden" id="co"><div class="sans" id="dh" style="font-size:14px;margin-top:6px"></div><div class="sans" style="font-size:12px;color:#666">${t("unav")}</div>
 <label>${t("gu")}<input type="number" id="gu" min="1" max="${r.cap}" value="1"></label>
 <label>${t("name")}<input id="nm" autocomplete="name"></label>
 <label>${t("mail")}<input id="em" type="email" autocomplete="email"></label>
 <label>${t("tel")}<input id="tl" type="tel" autocomplete="tel"></label>
 <label>${t("msgl")}<textarea id="ms" rows="2"></textarea></label>
 <div class="tot" id="tot"></div><div id="res"></div>
 <button class="btn" id="go" style="width:100%">${t("send")}</button>
 <button class="btn ghost" onclick="$('modal').classList.remove('open')">${t("close")}</button>`;
 $("modal").classList.add("open");
 const upd=()=>{const n=nights();$("tot").textContent=n>0?`${t("total")}: ${n*r.p} € (${n} ${t("nights")})`:""};
 const nights=()=>Math.round((new Date($("co").value)-new Date($("ci").value))/864e5);
 initCal(id,upd);
 $("go").onclick=()=>send(r,nights());
}

function monthOpts(){
 const o=[],now=new Date();
 for(let y=now.getFullYear();y<=now.getFullYear()+1;y++){
  for(const m of [9,10,11])o.push({v:y+"-"+(m+1),d:new Date(y,m,1)});
  for(const m of [0,1,2,3,4])o.push({v:(y+1)+"-"+(m+1),d:new Date(y+1,m,1)});
 }
 const cur=new Date(now.getFullYear(),now.getMonth(),1);
 return o.filter(x=>x.d>=cur);
}
function openMonthly(){
 const opts=monthOpts();
 $("sheet").innerHTML=`<h2 style="margin:0">${HOTELS[hotel].name}</h2><div class="sans">${t("monthly")} · 550 € ${t("mper")}</div>
 <div class="sans" style="font-size:13px;color:#666;margin-top:4px">${t("msub")}</div>
 <label>${t("mstart")}<select id="mst">${opts.map(o=>`<option value="${o.v}">${o.d.toLocaleDateString(lang,{month:"long",year:"numeric"})}</option>`).join("")}</select></label>
 <label>${t("mcount")}<input type="number" id="mct" min="1" max="8" value="1"></label>
 <label>${t("name")}<input id="nm" autocomplete="name"></label>
 <label>${t("mail")}<input id="em" type="email" autocomplete="email"></label>
 <label>${t("tel")}<input id="tl" type="tel" autocomplete="tel"></label>
 <label>${t("msgl")}<textarea id="ms" rows="2"></textarea></label>
 <div class="tot" id="mtot"></div><div id="res"></div>
 <button class="btn" id="go" style="width:100%">${t("send")}</button>
 <button class="btn ghost" onclick="$('modal').classList.remove('open')">${t("close")}</button>`;
 $("modal").classList.add("open");
 const upd=()=>{const n=+$("mct").value||0;$("mtot").textContent=n>0?`${t("total")}: ${n*550} € (${n} × 550 €)`:""};
 $("mct").oninput=upd;upd();
 $("go").onclick=sendMonthly;
}
async function sendMonthly(){
 const v=i=>$(i).value.trim();
 const n=Math.max(1,Math.min(8,+$("mct").value||0)),start=$("mst")?$("mst").value:"";
 if(!start||n<1){$("res").innerHTML=`<div class="msg" style="background:#f8dcdc">${t("merrd")}</div>`;return}
 if(!v("nm")||!v("em")||!v("tl")){$("res").innerHTML=`<div class="msg" style="background:#f8dcdc">${t("errf")}</div>`;return}
 const [y,m]=start.split("-").map(Number);
 const sd=new Date(y,m-1,1).toLocaleDateString(lang,{month:"long",year:"numeric"});
 const ed=new Date(y,m-1+n-1,1).toLocaleDateString(lang,{month:"long",year:"numeric"});
 const data={_subject:`Alquiler mensual ${HOTELS[hotel].name}`,_template:"table",_captcha:"false",_replyto:v("em"),
  Hotel:HOTELS[hotel].name,Tipo:`Alquiler mensual (550 €${t("mper")})`,Inicio:sd,Fin:ed,Meses:n,Total_estimado:`${n*550} €`,
  Nombre:v("nm"),Email:v("em"),Telefono:v("tl"),Mensaje:v("ms"),Idioma:lang,Google_Sheet:BOOKING_SHEET_URL};
 $("go").disabled=true;$("go").textContent=t("sending");
 try{
  const resp=await fetch("https://formsubmit.co/ajax/"+EMAIL,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(data)});
  const j=await resp.json().catch(()=>({}));
  if(!resp.ok||j.success===false||j.success==="false")throw 0;
  $("res").innerHTML=`<div class="msg">${t("ok")}</div>`;$("go").style.display="none";
 }catch(e){
  $("res").innerHTML=`<div class="msg" style="background:#f8e9c8">${t("fb")}<br><br><a class="btn" style="display:block;text-align:center;text-decoration:none" href="${mk(data)}">${t("mailapp")}</a></div>`;
  $("go").disabled=false;$("go").textContent=t("send");
 }
}
async function send(r,n){
 const v=i=>$(i).value.trim();
 if(!(n>0)||(()=>{const d=new Date(v("ci")+"T12:00");for(let i=0;i<n;i++){if(taken(r.id,iso(d)))return true;d.setDate(d.getDate()+1)}return false})()){$("res").innerHTML=`<div class="msg" style="background:#f8dcdc">${t("errd")}</div>`;return}
 if(!v("nm")||!v("em")||!v("tl")){$("res").innerHTML=`<div class="msg" style="background:#f8dcdc">${t("errf")}</div>`;return}
 const data={_subject:`Reserva ${HOTELS[hotel].name} - ${t(r.type)}`,_template:"table",_captcha:"false",_replyto:v("em"),
  Hotel:HOTELS[hotel].name,Habitacion_ID:r.id,Habitacion:`${T.es[r.type]} (${r.p}€/noche)`,Llegada:v("ci"),Salida:v("co"),Noches:n,Total_estimado:`${n*r.p} €`,
  Personas:v("gu"),Nombre:v("nm"),Email:v("em"),Telefono:v("tl"),Mensaje:v("ms"),Idioma:lang,Google_Sheet:BOOKING_SHEET_URL};
 $("go").disabled=true;$("go").textContent=t("sending");
 try{
  const resp=await fetch("https://formsubmit.co/ajax/"+EMAIL,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(data)});
  const j=await resp.json().catch(()=>({}));
  if(!resp.ok||j.success===false||j.success==="false")throw 0;
  $("res").innerHTML=`<div class="msg">${t("ok")}<br><a href="${mk(data)}">${t("mailapp")}</a></div>`;$("go").style.display="none";
 }catch(e){
  $("res").innerHTML=`<div class="msg" style="background:#f8e9c8">${t("fb")}<br><br><a class="btn" style="display:block;text-align:center;text-decoration:none" href="${mk(data)}">${t("mailapp")}</a></div>`;
  $("go").disabled=false;$("go").textContent=t("send");
 }
}
function mk(data){
 const body=Object.entries(data).filter(([k])=>k[0]!=="_").map(([k,x])=>`${k}: ${x}`).join("\n");
 return `mailto:${EMAIL}?subject=${encodeURIComponent(data._subject)}&body=${encodeURIComponent(body)}`;
}

$("lang").value=lang;
$("lang").onchange=e=>{lang=e.target.value;$("modal").classList.remove("open");render()};
$("modal").onclick=e=>{if(e.target.id==="modal")e.target.classList.remove("open")};
render();loadBooked();
// Comprueba los cambios de Google Sheets periódicamente.
setInterval(async()=>{
 const changed=await loadBooked();
 if(changed && hotel){
  // Si el calendario está abierto, volver a pintarlo para aplicar inmediatamente
  // los cambios de Bloquear = Sí/No.
  const pv=document.getElementById("pv");
  if(pv && window.__redrawCalendar) window.__redrawCalendar();
 }
},15000);
</script>
